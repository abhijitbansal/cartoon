# DISABLED ON GITHUB (manually, since 2026-06-15; decision recorded
# 2026-09-05): Actions runner minutes cost money the maintainer does not
# want to pay. This file is kept as the reference recipe. The local gate is
# the real one — run before every commit:
#   cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # macOS runners are costly and burn CI credits fast; the Apple
        # adapters (swift / xcodebuild) are exercised locally on a Mac
        # instead. Re-add `macos-latest` here if that ever needs CI coverage.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-xdist
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g jest
      # Site version must track Cargo.toml (the in-repo source of truth); a
      # bump that forgets docs/index.html fails here. Fix: node
      # scripts/sync-site-version.mjs
      - run: node scripts/sync-site-version.mjs --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
