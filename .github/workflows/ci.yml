# The gate for main and every PR. The repo is public, so standard
# GitHub-hosted runners cost nothing. The same commands are the local gate:
#   cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        # The Apple adapters (swift / xcodebuild) are exercised locally on a
        # Mac; add `macos-latest` here if they need CI coverage.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every real-tool e2e test must run: a missing tool fails the job
      # instead of skipping (tests/common/mod.rs). Tool versions are pinned
      # here; upstream-drift.yml runs the same suite on the latest ones.
      CARTOON_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1 pytest-xdist==3.8.0 ruff==0.15.20 mypy==1.20.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install -g jest@30.5.2 vitest@5.0.3 typescript@6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      # Every manifest version (plugin.json, the site) must track Cargo.toml.
      - run: node scripts/check-versions.mjs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: node --test packages/npm/cartoon-wrap/test/wrapper.test.mjs
      - run: sh -n install.sh
