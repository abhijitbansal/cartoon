name: release
on:
  push:
    tags: ["v*"]

jobs:
  # Every manifest (Cargo.toml, plugin.json, docs/index.html) must agree with
  # the tag before anything is published anywhere. Cheap, and the only gate
  # left on GitHub since ci.yml is disabled by decision.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: package tarball
        shell: bash
        run: |
          bin=cartoon
          [[ "${{ matrix.target }}" == *windows* ]] && bin=cartoon.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$bin" dist/
          tar -C dist -czf "cartoon-${{ matrix.target }}.tar.gz" "$bin"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: cartoon-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cartoon-bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cartoon
            target/${{ matrix.target }}/release/cartoon.exe
          if-no-files-found: ignore

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: cartoon-*.tar.gz

  pypi-wheels:
    needs: verify-version
    strategy:
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --out wheels
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: wheels

  pypi-publish:
    needs: pypi-wheels
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token; PyPI trusts this
      # repo + workflow via the pending publisher configured on pypi.org.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # npm Trusted Publishing (OIDC) — each package's Trusted Publisher on
      # npmjs.com points at this repo + workflow; no NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5; Node 22 bundles an older npm.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: cartoon-bin-*
          path: bins
      - name: publish platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/npm-platform-packages.mjs "$VERSION" bins npm-out
          fails=""
          for d in npm-out/*/; do
            pkg=$(node -p "require('./$d/package.json').name")
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "skip $pkg@$VERSION: already published"
            else
              (cd "$d" && npm publish --access public) || fails="$fails $pkg"
            fi
          done
          # cartoon-wrap-win32-x64 is spam-blocked pending npm support
          # (docs/RELEASING.md "Known issues"); its failure must not stop
          # the parent publish. Any other failure still fails the job.
          # TODO: drop this exception once the name is unblocked.
          fails="${fails# }"
          if [ -n "$fails" ] && [ "$fails" != "cartoon-wrap-win32-x64" ]; then
            echo "::error::platform publish failed:$fails"
            exit 1
          fi
          [ -z "$fails" ] || echo "::warning::skipped known-blocked:$fails"
      - name: publish parent package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "cartoon-wrap@$VERSION" version >/dev/null 2>&1; then
            echo "skip cartoon-wrap@$VERSION: already published"
            exit 0
          fi
          node scripts/npm-set-version.mjs "$VERSION" packages/npm/cartoon-wrap
          (cd packages/npm/cartoon-wrap && npm publish --access public)

  crates-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # crates.io Trusted Publishing (OIDC) — the crate's Trusted Publisher
      # settings point at this repo + workflow; no CRATES_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
